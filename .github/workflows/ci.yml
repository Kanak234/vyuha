name: CI

# Validate the VYUHA VS Code extension through its existing verification contract.
# CI does not execute user programs; it only compiles and runs repository tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The existing verify script is the single project-level command for
      # vendoring dependencies, compiling the extension, and running smoke tests.
      - name: Run project verification
        run: npm run verify
